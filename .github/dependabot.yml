version: 2

updates:
  # Docker base images in the Dockerfiles (the GUI kasmvnc base + the headless
  # Libation base). NB: a bare rolling tag like `debianbookworm` has nothing for
  # Dependabot to bump - digest-pin it for that to work.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
    target-branch: "main"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "update"
    allow:
      - dependency-type: "all"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "main"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "update git-actions"
    allow:
      - dependency-type: "all"

# This GitHub Actions workflow builds and pushes Docker images on successful updates to main
name: Build and Push Docker Image

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggering

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Single source of truth: the Dockerfile ARG. (The version used to be duplicated
      # here as a workflow env var, which forced the update-checker to edit THIS file -
      # something the default GITHUB_TOKEN can never push. Deriving it instead means the
      # checker only ever touches the Dockerfile.)
      - name: Read Libation version from Dockerfile
        run: echo "LIBATION_VERSION=$(sed -n 's/^ARG LIBATION_VERSION=//p' Dockerfile | head -1)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Only login to DockerHub if we're actually pushing
      - name: Login to DockerHub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ env.LIBATION_VERSION }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=long

      - name: Build and Push Docker Image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Build for multiple platforms
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            LIBATION_VERSION=${{ env.LIBATION_VERSION }}
          # Enable caching for faster builds
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Add build metadata
          annotations: |
            org.opencontainers.image.title=Libate
            org.opencontainers.image.description=Libation in Docker with KasmVNC
            org.opencontainers.image.version=${{ env.LIBATION_VERSION }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      # Headless variant: the official upstream LibationCli image + our sync loop
      # (Dockerfile.headless). Same single-sourced version - passed as a build-arg,
      # which also pins the upstream FROM tag (rmcrackan/libation:<version>).
      - name: Build and Push Headless Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.headless
          # amd64 ONLY: this variant is deployed on CT 101 (amd64) and nothing else,
          # and cross-building it added an apt install (python3-minimal for the login
          # helper) under QEMU arm64 emulation - which ground for 15 min and got the
          # job cancelled (2026-08-06). The GUI image above stays multi-arch.
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:headless
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}:headless-${{ env.LIBATION_VERSION }}
          build-args: |
            LIBATION_VERSION=${{ env.LIBATION_VERSION }}
          cache-from: type=gha,scope=headless
          cache-to: type=gha,mode=max,scope=headless
          annotations: |
            org.opencontainers.image.title=Libate Headless
            org.opencontainers.image.description=Official Libation CLI image + sync loop with post-cycle hook
            org.opencontainers.image.version=${{ env.LIBATION_VERSION }}
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Image digest
        run: echo ${{ steps.build.outputs.digest }}
